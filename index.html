<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daftar Pesanan Soft Cookies</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section class="card">
    <h1>Daftar Pesanan Soft Cookies</h1>
    <p class="sub">Ori · Matcha · Red Velvet · 9K per cookie</p>
    <div class="grid">
      <div class="stat"><b id="tot">0</b><span>total cookies</span></div>
      <div class="stat"><b><span class="o" id="to">0</span> · <span class="m" id="tm">0</span> · <span class="r" id="tr">0</span></b><span>ori · matcha · red velvet</span></div>
      <div class="stat"><b id="tall">Rp 0</b><span>total tagihan</span></div>
      <div class="stat"><b id="inn">Rp 0</b><span>uang masuk</span></div>
      <div class="stat"><b id="out">Rp 0</b><span>belum masuk</span></div>
      <div class="stat"><b id="np">0 / 0</b><span>sudah bayar</span></div>
      <div class="stat"><b id="ns">0 / 0</b><span>sudah diantar</span></div>
    </div>
    <div class="jump">
      <a href="#selasa">Selasa</a><a href="#kamis">Kamis</a><a href="#widut">Tmn Widut</a><a href="#kakang">Kakangkasep</a>
    </div>
    <p class="save" id="save">Memuat...</p>
  </section>
  <div id="sections"></div>
  <button class="reset" id="reset" type="button">Hapus semua centang</button>
</main>
<script src="script.js"></script>
</body>
</html>
